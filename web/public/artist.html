<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artiste · Deauville Festival du Rire 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700&display=swap">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <h1 class="title"><span class="clef" aria-hidden="true">𝄞</span>Deauville Festival du Rire <em class="year">2027</em></h1>
        <p class="dates">10 – 13 juin 2027</p>
        <nav>
          <a href="/">← Programme</a>
          <a href="/#artistes">Tous les artistes</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="artist-header" id="artist-header"></div>
      <section>
        <h2>Sur scène</h2>
        <div class="cards" id="artist-performances"></div>
      </section>
    </main>

    <footer>Deauville Festival du Rire 2027 · 10–13 juin · Deauville</footer>

    <script src="/background.js"></script>
    <script src="/common.js"></script>
    <script>
      // La page d'un artiste : /artist.html?slug=max-pellerin
      async function showArtist() {
        const slug = new URLSearchParams(location.search).get("slug") || "";
        const header = document.getElementById("artist-header");
        try {
          const artist = await api(`/api/artists/${encodeURIComponent(slug)}`);
          document.title = `${artist.name} · Deauville Festival du Rire 2027`;
          header.innerHTML = `${avatarHtml(artist)}
            <div><h2>${esc(artist.name)}</h2>
            <p class="muted">${esc(artist.bio || "")}</p></div>`;
          document.getElementById("artist-performances").innerHTML =
            artist.performances.map((p) => performanceCard(p, { showDay: true })).join("");
        } catch (error) {
          header.innerHTML = `<div class="error-box">${esc(error.message)}</div>`;
        }
      }
      showArtist();
    </script>
  </body>
</html>
